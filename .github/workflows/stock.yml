name: nightly-stock
on:
  schedule:
    - cron: '0 7 * * *'   # nightly, ~2-3am US Eastern
  workflow_dispatch:
    inputs:
      metro:
        description: 'Metro override (else top of the coverage queue)'
        required: false
      cap:
        description: 'Max new orgs this run'
        required: false
        default: '50'
      census:
        description: 'Set 1 to run a counts-only census of all territories'
        required: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      # Persist the ProPublica detail cache between nights. Without it every
      # run re-fetches tens of thousands of already-rejected orgs and dies at
      # the timeout. Always restores the newest cache, always saves a new one.
      - uses: actions/cache@v4
        with:
          path: .cache/orgs
          key: propublica-orgs-${{ github.run_id }}
          restore-keys: |
            propublica-orgs-
      - run: npx tsx stock.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          METRO: ${{ inputs.metro }}
          CAP: ${{ inputs.cap }}
          CENSUS: ${{ inputs.census }}
